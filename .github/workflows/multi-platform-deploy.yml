name: CI/CD BeSeen (Versão Automática)

on:
  push:
    branches: [ main ]

jobs:
  # ==================== BUILD ANDROID ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Instalar Dependências
        run: npm install --legacy-peer-deps
      - name: Rodar Script de Preparação
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod
      - name: Compilar Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Assinar e Upload (Android)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # ==================== BUILD iOS ====================
  # ==================== BUILD iOS ====================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação
        run: |
            chmod +x ./scripts/prepare-mobile.sh
            ./scripts/prepare-mobile.sh prod

      - name: Build Frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Instalar Gems
        run: |
          cd ios/App
          bundle install

      - name: Instalar Pods
        run: |
          cd ios/App
          bundle exec pod install || pod install

      - name: Configurar Certificado
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD="build"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security default-keychain -s "$KEYCHAIN_PATH"

          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$CERT_BASE64" | base64 --decode > certificate.p12

          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$CERT_PASSWORD" \
            -A

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

      - name: Instalar Provisioning Profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision

          security cms -D -i profile.mobileprovision > decoded.plist

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" decoded.plist)

          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          echo "Provisioning UUID: $UUID"

      - name: Verificar Schemes
        run: |
          cd ios/App
          xcodebuild -list

      - name: Verificar Certificados
        run: |
          security find-identity -v -p codesigning

      - name: Set Team ID
        run: |
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = HJR4R6DQV4;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Executar Fastlane
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPLE_AUTHENTICATION_KEY_BASE64 }}
        run: |
          cd ios/App
          bundle exec fastlane beta
