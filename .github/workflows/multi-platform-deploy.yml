name: CI/CD BeSeen (Versão Automática)

on:
  push:
    branches: [ main ]

jobs:
  # ==================== BUILD ANDROID ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação Completo (Build, Firebase, Sync)
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod

      - name: Aplicar Versão Automática (Android)
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 24 ))
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          npx capacitor-set-version -v "$(node -p "require('./package.json').version")" -b $VERSION_CODE

      - name: Compilar Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Assinar Arquivo Digitalmente
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: beseen-android-v${{ env.ANDROID_VERSION_CODE }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

  # ==================== BUILD iOS ====================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação Completo
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod

      - name: Forçar Atualização dos Pods do RevenueCat
        run: |
          npx cap sync ios
          cd ios/App
          pod repo update
          pod update RevenueCat PurchasesHybridCommon --no-repo-update

      - name: Aplicar Versão Automática (iOS)
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 24 ))
          npx capacitor-set-version -v "$(node -p "require('./package.json').version")" -b $VERSION_CODE

      - name: Forçar Assinatura Automática e TeamID no Projeto
        run: |
          # Altera globalmente o estilo de assinatura para Automático
          sed -i '' 's/ProvisioningStyle = Manual;/ProvisioningStyle = Automatic;/g' ios/App/App.xcodeproj/project.pbxproj

          # Remove e limpa qualquer configuração antiga de perfis manuais residuais
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*";//g' ios/App/App.xcodeproj/project.pbxproj

          # Injeta o seu Team ID em todas as diretivas vazias do Xcode
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = HJR4R6DQV4;/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Configurar Assinatura Apple
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPLE_AUTHENTICATION_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          mkdir -p ~/.private_keys
          cp ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 ~/.private_keys/

      - name: Compilar e Enviar para TestFlight
        run: |
          xcodebuild clean -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -destination "generic/platform=iOS" \
                     -configuration Release \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER }}" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
                     DEVELOPMENT_TEAM="HJR4R6DQV4" \
                     CODE_SIGN_STYLE="Automatic" \
                     archive -archivePath ios/App/App.xcarchive

          xcodebuild -exportArchive \
                     -archivePath ios/App/App.xcarchive \
                     -exportOptionsPlist ios/App/App/ExportOptions.plist \
                     -exportPath ios/App/build \
                     -allowProvisioningUpdates \
                     -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER }}" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8" \
                     DEVELOPMENT_TEAM="HJR4R6DQV4"

      - name: Upload para App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-package ios/App/build/App.ipa \
                       --type ios \
                       --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
                       --apiIssuer "${{ secrets.APPLE_API_ISSUER }}"
