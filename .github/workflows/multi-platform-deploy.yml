name: CI/CD BeSeen (Versão Automática)

on:
  push:
    branches: [ main ]

jobs:
  # ==================== BUILD ANDROID ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação Completo
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod

      - name: Aplicar Versão Automática (Android)
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 24 ))
          echo "ANDROID_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          npx capacitor-set-version -v "$(node -p "require('./package.json').version")" -b $VERSION_CODE

      - name: Compilar Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Assinar Arquivo Digitalmente
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: beseen-android-v${{ env.ANDROID_VERSION_CODE }}
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

  # ==================== BUILD iOS ====================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação Completo
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod

      - name: Sincronizar e Preparar Pods
        run: |
          npx cap sync ios
          cd ios/App
          # O patch do Podfile já está lá, basta instalar
          rm -rf Pods
          rm -rf Podfile.lock
          pod install

      - name: Aplicar Versão Automática (iOS)
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 24 ))
          npx capacitor-set-version -v "$(node -p "require('./package.json').version")" -b $VERSION_CODE

      - name: Configurar Assinatura Apple
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.APPLE_AUTHENTICATION_KEY_BASE64 }}" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          mkdir -p ~/.private_keys
          cp ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8 ~/.private_keys/

      - name: Instalar Certificado e Perfil de Provisionamento
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # 1. Criar Keychain temporário
          security create-keychain -p "" build.keychain
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # 2. Decodificar e importar certificado
          echo $CERT_BASE64 | base64 --decode > distribution.p12
          security import distribution.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          # 3. Instalar Perfil de Provisionamento (Decodificação Robusta)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $PROFILE_BASE64 | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile_decoded.plist
          
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" profile_decoded.plist)
          # Busca o Team ID de forma mais robusta no campo TeamIdentifier
          TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" profile_decoded.plist)
          
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=$TEAM_ID" >> $GITHUB_ENV
          
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "✅ Perfil: $UUID | Team: $TEAM_ID"

      - name: Compilar e Enviar para TestFlight
        run: |
          # 1. Gerar ExportOptions.plist minimalista e robusto
          cat <<EOF > ios/App/App/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.beseen.app.official</key>
                  <string>$PROVISIONING_PROFILE_UUID</string>
              </dict>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          
          echo "--- DEBUG: ExportOptions.plist ---"
          cat ios/App/App/ExportOptions.plist
          echo "----------------------------------"

          # 2. Archive (Forçando arquitetura arm64)
          xcodebuild archive -workspace ios/App/App.xcworkspace \
                     -scheme App \
                     -destination "generic/platform=iOS" \
                     -configuration Release \
                     -archivePath ios/App/App.xcarchive \
                     ARCHS=arm64 \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="Apple Distribution" \
                     PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
                     DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
                     SKIP_INSTALL=NO

          # 3. Export
          xcodebuild -exportArchive \
                     -archivePath ios/App/App.xcarchive \
                     -exportOptionsPlist ios/App/App/ExportOptions.plist \
                     -exportPath ios/App/build \
                     -authenticationKeyID "${{ secrets.APPLE_API_KEY_ID }}" \
                     -authenticationKeyIssuerID "${{ secrets.APPLE_API_ISSUER }}" \
                     -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8"

      - name: Upload para App Store Connect (TestFlight)
        run: |
          xcrun altool --upload-package ios/App/build/App.ipa \
                       --type ios \
                       --apiKey "${{ secrets.APPLE_API_KEY_ID }}" \
                       --apiIssuer "${{ secrets.APPLE_API_ISSUER }}"
