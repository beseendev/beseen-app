name: CI/CD BeSeen (Versão Automática)

on:
  push:
    branches: [ main ]

jobs:
  # ==================== BUILD ANDROID ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Instalar Dependências
        run: npm install --legacy-peer-deps
      - name: Rodar Script de Preparação
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod
      - name: Compilar Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Assinar e Upload (Android)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # ==================== BUILD iOS ====================
  # ==================== BUILD iOS ====================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios/App

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Build do Projeto Frontend
        run: npm run build

      - name: Sincronizar e Pods
        run: |
          npx cap sync ios
          cd ios/App && pod install

      - name: Instalar Certificado e Perfil
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PWD="build"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          echo $CERT_BASE64 | base64 --decode > distribution.p12
          security import distribution.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $PROFILE_BASE64 | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > decoded.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" decoded.plist)
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV

      - name: Build e Deploy via Fastlane
        env:
          PROVISIONING_PROFILE_UUID: ${{ env.PROVISIONING_PROFILE_UUID }}
          API_KEY_PATH: ${{ github.workspace }}/ios/App/auth_key.p8
        run: |
          gem install fastlane
          mkdir -p ios/App/fastlane
          cat <<EOF > ios/App/fastlane/Appfile
          app_identifier("com.beseen.app.official")
          itc_team_id("HJR4R6DQV4")
          team_id("HJR4R6DQV4")
          EOF
          cat <<EOF > ios/App/fastlane/Fastfile
          default_platform(:ios)
          platform :ios do
            lane :deploy do
              build_app(workspace: "App.xcworkspace", scheme: "App", export_method: "app-store", export_options: { signingStyle: "manual", provisioningProfiles: { "com.beseen.app.official" => ENV["PROVISIONING_PROFILE_UUID"] } }, build_settings: { "CODE_SIGN_IDENTITY" => "Apple Distribution", "PROVISIONING_PROFILE_SPECIFIER" => ENV["PROVISIONING_PROFILE_UUID"] })
              upload_to_testflight(api_key_path: ENV["API_KEY_PATH"], skip_waiting_for_build_processing: true)
            end
          end
          EOF
          echo "${{ secrets.APPLE_AUTHENTICATION_KEY_BASE64 }}" | base64 --decode > $API_KEY_PATH
          cd ios/App && fastlane deploy
