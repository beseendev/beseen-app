name: CI/CD BeSeen (Versão Automática)

on:
  push:
    branches: [ main ]

jobs:
  # ==================== BUILD ANDROID ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Instalar Dependências
        run: npm install --legacy-peer-deps
      - name: Rodar Script de Preparação
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod
      - name: Compilar Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Assinar e Upload (Android)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

  # ==================== BUILD iOS ====================
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby (para Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ios/App

      - name: Instalar Dependências NPM
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod

      - name: Sincronizar e Preparar Pods
        run: |
          npx cap sync ios
          cd ios/App
          pod install

      - name: Instalar Certificado e Perfil
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # 1. Preparar o Keychain de Login (mais estável no CI)
          security unlock-keychain -p "" login.keychain
          security set-keychain-settings -lut 21600 login.keychain

          # 2. Importar Certificado e WWDR Intermediate
          echo $CERT_BASE64 | base64 --decode > distribution.p12
          security import distribution.p12 -k login.keychain -P "$CERT_PASSWORD" -A
          
          curl -s https://developer.apple.com/certificationauthority/AppleWWDRCA.cer -o AppleWWDRCA.cer
          security import AppleWWDRCA.cer -k login.keychain -A
          
          # Permitir acesso total ao codesign para evitar pop-ups
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" login.keychain

          # 3. Instalar Perfil e extrair UUID real (Usando método robusto)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $PROFILE_BASE64 | base64 --decode > profile.mobileprovision
          
          # Extração via security cms para evitar erro de binário
          security cms -D -i profile.mobileprovision > decoded.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" decoded.plist)
          
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV
          echo "✅ Perfil Instalado e Validado: $UUID"

      - name: Build e Deploy via Fastlane
        env:
          PROVISIONING_PROFILE_UUID: ${{ env.PROVISIONING_PROFILE_UUID }}
          API_KEY_PATH: ${{ github.workspace }}/ios/App/auth_key.p8
        run: |
          echo "${{ secrets.APPLE_AUTHENTICATION_KEY_BASE64 }}" | base64 --decode > $API_KEY_PATH
          cd ios/App
          bundle exec fastlane deploy
