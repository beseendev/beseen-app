name: CI/CD BeSeen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ==================== BUILD ANDROID ====================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Garantir Android SDK Platform 36 e Build-Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar Dependências
        run: npm install --legacy-peer-deps
      - name: Rodar Script de Preparação
        run: |
          chmod +x ./scripts/prepare-mobile.sh
          ./scripts/prepare-mobile.sh prod
      - name: Compilar Bundle (.aab)
        run: |
          cd android
          ./gradlew bundleRelease
      - name: Assinar e Upload (Android)
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Disponibilizar arquivo para Download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-assinado
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

  # ==================== BUILD iOS ====================
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Selecionar Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Rodar Script de Preparação
        run: |
            chmod +x ./scripts/prepare-mobile.sh
            ./scripts/prepare-mobile.sh prod

      - name: Build Frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Instalar Gems
        run: |
          cd ios/App
          bundle install

      - name: Instalar Pods
        run: |
          cd ios/App
          bundle exec pod install || pod install

      - name: Verificar Schemes
        run: |
          cd ios/App
          xcodebuild -list

      - name: Setup SSH (para match repo)
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_KEY }}

      - name: Force SSH for Git
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Executar Fastlane (Build IPA)
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPSTORE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          FASTLANE_ITMS_TRANSPORTER_TYPE: "itmstransporter"
        run: |
          cd ios/App
          bundle exec fastlane beta
