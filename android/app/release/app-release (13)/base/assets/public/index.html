<body>
  <app-root>
    <style>
      :root {
        --be-color-bg: #0f172a;
        --be-color-brand-500: #22c55e;
        --be-color-text-1: #ffffff;
      }
      .splash-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--be-color-bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: "Poppins", "Inter", sans-serif;
      }
      .brand-title {
        margin: 0;
        line-height: 1;
        letter-spacing: -0.025em;
        font-weight: 800;
        font-size: clamp(2.5rem, 8.2vw, 3rem);
        color: var(--be-color-text-1);
        text-align: center;
      }
      .brand-seen-wrap {
        position: relative;
        display: inline-block;
        padding-top: 0.34em;
        color: var(--be-color-brand-500);
      }
      .brand-lights-canvas {
        position: absolute;
        top: calc(-0.18em + 6px);
        left: 50%;
        transform: translateX(-50%);
        pointer-events: none;
        z-index: 2;
      }
    </style>
    <div class="splash-container">
      <h1 class="brand-title"><span>Be</span><span id="splash-seen-wrap" class="brand-seen-wrap"><canvas id="splash-lights" class="brand-lights-canvas"></canvas><span>Seen</span></span></h1>
    </div>
    <script>
      (function() {
        const canvas = document.getElementById('splash-lights');
        const seenWrap = document.getElementById('splash-seen-wrap');
        if (!canvas) return;

        function render() {
          const seenWidth = seenWrap ? seenWrap.getBoundingClientRect().width : 0;
          const targetWidth = Math.max(60.021, seenWidth * 0.514425);
          const targetHeight = Math.max(20.577, targetWidth * 0.28293375);
          canvas.style.width = targetWidth + 'px';
          canvas.style.height = targetHeight + 'px';

          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          canvas.width = Math.floor(rect.width * dpr);
          canvas.height = Math.floor(rect.height * dpr);
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const w = rect.width;
          const h = rect.height;
          ctx.clearRect(0, 0, w, h);

          const centerX = w / 2;
          const centerY = h / 2;
          const groupOffsetX = w * 0.26;
          const radius = Math.max(3.4295, Math.min(w, h) * 0.102885);
          const spacing = radius * 2.05;

          function drawGroup(x, angle) {
            ctx.save();
            ctx.translate(x, centerY);
            ctx.rotate(angle);
            for (let i = -1; i <= 1; i++) {
              const lx = i * spacing;
              const ly = 0;
              const glow = ctx.createRadialGradient(lx, ly, radius * 0.2, lx, ly, radius * 3.2);
              glow.addColorStop(0, 'rgba(34, 197, 94, 0.24)');
              glow.addColorStop(1, 'rgba(34, 197, 94, 0)');
              ctx.fillStyle = glow;
              ctx.beginPath();
              ctx.arc(lx, ly, radius * 3.2, 0, Math.PI * 2);
              ctx.fill();
              const core = ctx.createRadialGradient(lx - radius * 0.25, ly - radius * 0.28, radius * 0.2, lx, ly, radius);
              core.addColorStop(0, '#FDFEFE');
              core.addColorStop(1, '#CBD5E1');
              ctx.fillStyle = core;
              ctx.beginPath();
              ctx.arc(lx, ly, radius, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          drawGroup(centerX - groupOffsetX, -0.24);
          drawGroup(centerX + groupOffsetX, 0.24);
        }

        render();
        setTimeout(render, 40);
        window.addEventListener('resize', render);
      })();
    </script>
