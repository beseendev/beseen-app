<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Ionic App</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <app-root>
    <style>
      :root {
        --be-color-bg: #0f172a;
        --be-color-brand-500: #22c55e;
        --be-color-text-1: #ffffff;
      }
      .splash-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--be-color-bg);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: "Poppins", "Inter", sans-serif;
      }
      .brand-title {
        margin: 0;
        line-height: 1;
        letter-spacing: -0.025em;
        font-weight: 800;
        font-size: clamp(2.5rem, 15vw, 4rem);
        color: var(--be-color-text-1);
        text-align: center;
      }
      .brand-seen-wrap {
        position: relative;
        display: inline-block;
        padding-top: 0.34em;
        color: var(--be-color-brand-500);
      }
      .brand-lights-canvas {
        position: absolute;
        top: calc(-0.12em + 8px);
        left: 50%;
        transform: translateX(-50%);
        width: 2.1em;
        height: 0.74em;
        pointer-events: none;
      }
    </style>
    <div class="splash-container">
      <h1 class="brand-title">
        <span>Be</span>
        <span class="brand-seen-wrap">
          <canvas id="splash-lights" class="brand-lights-canvas"></canvas>
          <span>Seen</span>
        </span>
      </h1>
    </div>
    <script>
      (function() {
        const canvas = document.getElementById('splash-lights');
        if (!canvas) return;

        function render() {
          const dpr = window.devicePixelRatio || 1;
          const rect = canvas.getBoundingClientRect();
          canvas.width = rect.width * dpr;
          canvas.height = rect.height * dpr;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;

          ctx.scale(dpr, dpr);
          const w = rect.width;
          const h = rect.height;
          ctx.clearRect(0, 0, w, h);

          const centerX = w / 2;
          const centerY = h / 2;
          const groupOffsetX = w * 0.26;
          const radius = Math.max(3.5, w * 0.05);
          const spacing = radius * 2.05;

          function drawGroup(x, angle) {
            ctx.save();
            ctx.translate(x, centerY);
            ctx.rotate(angle);
            for (let i = -1; i <= 1; i++) {
              const lx = i * spacing;
              const ly = 0;
              // Glow
              const glow = ctx.createRadialGradient(lx, ly, radius * 0.2, lx, ly, radius * 3);
              glow.addColorStop(0, 'rgba(34, 197, 94, 0.25)');
              glow.addColorStop(1, 'rgba(34, 197, 94, 0)');
              ctx.fillStyle = glow;
              ctx.beginPath();
              ctx.arc(lx, ly, radius * 3, 0, Math.PI * 2);
              ctx.fill();
              // Core
              const core = ctx.createRadialGradient(lx - radius * 0.2, ly - radius * 0.2, radius * 0.2, lx, ly, radius);
              core.addColorStop(0, '#FFFFFF');
              core.addColorStop(1, '#CBD5E1');
              ctx.fillStyle = core;
              ctx.beginPath();
              ctx.arc(lx, ly, radius, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();
          }

          drawGroup(centerX - groupOffsetX, -0.24);
          drawGroup(centerX + groupOffsetX, 0.24);
        }

        render();
        window.addEventListener('resize', render);
      })();
    </script>
  </app-root>
</body>

</html>
