<ion-header class="ion-no-border">
  <app-social-header [notificationsCount]="unreadNotificationsCount" [messagesCount]="chatUnreadCount"
    (notifications)="goToNotifications()" (messages)="openChatInbox()">
  </app-social-header>
</ion-header>
<ion-content [fullscreen]="false" id="main-content" class="arena-content">
  <ion-refresher slot="fixed" (ionRefresh)="refreshPosts($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="arena-shell">
    <section class="section tab-panel" [class.active]="activeTab === 'new'" *ngIf="activeTab === 'new'">
      <div class="video-stack be-tiktok-container" *ngIf="newVideosWithAds.length > 0">
        <ng-container *ngFor="let item of newVideosWithAds; trackBy: trackByFeedItem">
          <article class="be-tiktok-card be-fade-in" *ngIf="item.type === 'video'">
            <video
              #vNew
              #newPlayer="appViewportVideoPlayer"
              appViewportVideoPlayer
              [src]="item.video.mediaUrl + '#t=0.001'"
              muted
              loop
              playsinline
              controlsList="nodownload nopictureinpicture"
              preload="metadata"
              class="be-tiktok-video"
              [class.is-horizontal]="newPlayer.isHorizontal">
            </video>

            <div class="video-player-state loading" *ngIf="newPlayer.isLoading && !newPlayer.hasError && !newPlayer.showTapGate">
              <ion-spinner name="crescent"></ion-spinner>
            </div>
            <div class="video-player-state pulse" *ngIf="newPlayer.showPulse">
              <ion-icon [name]="newPlayer.isPaused ? 'play' : 'pause'"></ion-icon>
            </div>
            <div class="video-player-state tap-gate" *ngIf="newPlayer.showTapGate">
              <span>Toque para assistir</span>
            </div>
            <div class="video-player-error" *ngIf="newPlayer.hasError">
              <strong>Video indisponivel</strong>
              <ion-button size="small" fill="solid" (click)="newPlayer.retry($event)">Tentar novamente</ion-button>
            </div>

            <ion-button fill="clear" class="video-mute-btn" (click)="newPlayer.toggleMute($event)" [attr.aria-label]="newPlayer.isMuted ? 'Ativar som' : 'Silenciar video'">
              <ion-icon [name]="newPlayer.isMuted ? 'volume-mute-outline' : 'volume-high-outline'"></ion-icon>
            </ion-button>

            <ion-button fill="clear" class="video-report-btn" (click)="reportVideo(item.video)" aria-label="Denunciar video">
              <ion-icon name="flag-outline"></ion-icon>
            </ion-button>

            <div class="be-tiktok-overlay">
              <div class="be-tiktok-info">
                <button type="button" class="profile-link" (click)="openAthleteProfile(item.video)">
                  <h3 class="athlete-heading">
                    <span class="athlete-first-name">{{ item.video.athleteName.split(' ')[0] }}</span>
                    <span class="athlete-position" *ngIf="item.video.position">- {{ item.video.position }}</span>
                  </h3>
                </button>
                <p class="showcase-description">{{ item.video.description }}</p>
                <p class="meta-line" *ngIf="item.video.modality">
                    <span *ngIf="item.video.modality">{{ item.video.modality }}</span>
                </p>
              </div>
            </div>

            <div class="be-tiktok-actions">
               <button type="button" aria-label="Abrir perfil do atleta" class="be-tiktok-avatar be-tiktok-avatar--card" (click)="openAthleteProfile(item.video)">
                  <app-player-card [profile]="toPlayerCardProfile(item.video)" size="xsmall"></app-player-card></button>
            </div>
          </article>
          <app-ad-card *ngIf="item.type === 'ad'" [ad]="item.ad"></app-ad-card>
        </ng-container>
      </div>
    </section>
    <app-banner-carousel class="section"></app-banner-carousel>
  </div>

  <ion-infinite-scroll (ionInfinite)="loadMorePosts($event)">
    <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Carregando mais jogadas..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<app-player-evaluation-modal #evaluationModal></app-player-evaluation-modal>
