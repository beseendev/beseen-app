<section class="profile-drawer">
  <header class="profile-head">
    <div class="profile-head-row">
      <app-player-card class="player-profile-avatar" [profile]="profile" size="small"></app-player-card>

      <div class="profile-head-copy">
        <h2>{{ displayName }}</h2>
        <p>{{ displayPosition }}</p>
      </div>
    </div>
    <div class="about">
    </div>
  </header>

  <div class="actions">
    <ion-button fill="clear" (click)="onMyVideos()" aria-label="Abrir meus vídeos">Meus vídeos</ion-button>
    <ion-button fill="clear" (click)="onInvites()" aria-label="Abrir meus convites">Meus convites</ion-button>
    <ion-button fill="clear" (click)="onEditProfile()" aria-label="Editar perfil">Editar perfil</ion-button>
    <ion-button fill="clear" (click)="onBlockedUsers()" aria-label="Usuários bloqueados">Usuários bloqueados</ion-button>
    <ion-button fill="clear" color="medium" (click)="onSignOut()" aria-label="Sair da conta">Sair</ion-button>
    <ion-button fill="clear" color="danger" class="delete-account-btn" (click)="onDeleteAccount()" aria-label="Excluir conta">Excluir conta</ion-button>
  </div>
</section>
