<ion-content class="account-confirmation-screen">
  <div class="account-confirmation-container">
    <div class="brand-wrap">
      <h1 class="brand-title">
        <span class="brand-be">Be</span><span class="brand-seen">Seen</span>
      </h1>
      <p class="brand-tagline">Sua vitrine no esporte</p>
    </div>

    <section class="confirmation-header">
      <div class="confirmation-icon">
        <ion-icon name="shield-checkmark-outline"></ion-icon>
      </div>
      <h2>Confirme sua conta</h2>
      <p>Enviamos um código de 6 dígitos para o seu e-mail. Insira o código abaixo para ativar seu acesso.</p>
    </section>

    <form [formGroup]="confirmationForm" (ngSubmit)="confirmCode()" class="confirmation-form">
      <ion-item class="input-field" color="none">
        <ion-icon name="shield-checkmark-outline" slot="start"></ion-icon>
        <ion-input
          type="text"
          formControlName="code"
          placeholder="Código de 6 dígitos"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code">
        </ion-input>
      </ion-item>
      <div *ngIf="confirmationForm.get('code')?.invalid && confirmationForm.get('code')?.touched" class="error-text">
        O código deve ter 6 dígitos numéricos.
      </div>

      <ion-button expand="block" type="submit" [disabled]="confirmationForm.invalid || isConfirming" class="confirm-button">
        <span *ngIf="!isConfirming">Confirmar</span>
        <ion-spinner *ngIf="isConfirming" name="crescent"></ion-spinner>
      </ion-button>
    </form>

    <div class="secondary-actions">
      <ion-button fill="clear" class="text-action" (click)="resendCode()" [disabled]="isCooldownActive || isResending">
      <ion-spinner *ngIf="isResending" name="crescent"></ion-spinner>
      <span *ngIf="!isResending && !isCooldownActive">Reenviar código</span>
      <span *ngIf="!isResending && isCooldownActive">Aguarde {{ cooldownSeconds }}s...</span>
      </ion-button>

      <ion-button fill="clear" class="text-action muted" routerLink="/login">
        Voltar para o login
      </ion-button>
    </div>
  </div>
</ion-content>
