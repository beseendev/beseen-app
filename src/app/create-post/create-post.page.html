<ion-header class="ion-no-border create-post-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()" class="back-button" aria-label="Voltar para a vitrine">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Publicar na Vitrine</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="create-post-screen" [fullscreen]="true">
  <div class="create-post-container">
    <input #fileInput type="file" (change)="onFileSelected($event)" accept="image/*,video/*" class="hidden-input">

    <section class="upload-card" [class.has-media]="selectedMedia">
      <div *ngIf="!selectedMedia" class="upload-empty-state">
        <div class="sport-icon-badge">
          <ion-icon name="star-outline"></ion-icon>
        </div>
        <h2>Mostre seu melhor momento para brilhar</h2>
        <p>Envie um vídeo ou foto e destaque seu talento</p>
        <ion-button class="select-media-btn" (click)="fileInput.click()" aria-label="Selecionar foto ou vídeo">
          <ion-icon slot="start" name="image-outline"></ion-icon>
          Selecionar mídia
        </ion-button>
      </div>

      <div *ngIf="selectedMedia" class="media-preview-wrap" [class.is-video]="selectedMedia.type.startsWith('video')">
        <img *ngIf="selectedMedia.type.startsWith('image')" [src]="selectedMediaUrl" alt="Pré-visualização da mídia" class="preview-media">
        <video *ngIf="selectedMedia.type.startsWith('video')" [src]="selectedMediaUrl" controls controlsList="nodownload nopictureinpicture" playsinline preload="metadata" class="preview-media"></video>

        <button type="button" class="remove-media-btn" (click)="removeSelectedMedia()" aria-label="Remover mídia">
          <ion-icon name="close-outline"></ion-icon>
        </button>
      </div>
    </section>

    <div class="engagement-hint">
      <div class="hint-icon">
        <ion-icon name="flash-outline"></ion-icon>
      </div>
      <div class="hint-content">
        <strong>Dica de Engajamento</strong>
        <p>Vídeos de até <strong>30 segundos</strong> têm maior alcance e engajamento dos olheiros!</p>
      </div>
    </div>

    <section class="caption-card">
      <ion-textarea
        placeholder="Descreva seu desempenho ou destaque..."
        [(ngModel)]="caption"
        [autoGrow]="true"
        maxlength="2200"
      ></ion-textarea>
      <div class="caption-counter">{{ caption.length }}/2200</div>
    </section>

    <p class="file-error" *ngIf="fileError">{{ fileError }}</p>
  </div>
</ion-content>

<ion-footer class="ion-no-border publish-footer">
  <ion-toolbar>
    <div class="publish-button-wrap">
      <ion-button
        expand="block"
        class="publish-button"
        (click)="submitPost()"
        aria-label="Publicar conteúdo na vitrine"
        [disabled]="!selectedMedia || isSubmitting"
      >
        Publicar
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
