<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Escolha seu Plano</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="plans-container">
    <p class="intro-text">Para continuar como Olheiro de Clube, você precisa de uma assinatura ativa.</p>

    <div *ngIf="loading" class="ion-text-center ion-padding">
      <ion-spinner name="crescent"></ion-spinner>
      <p>Carregando planos...</p>
    </div>

    <div *ngIf="!loading && plans.length === 0" class="ion-text-center ion-padding">
      <p>Nenhum plano disponível no momento.</p>
    </div>

    <ion-card *ngFor="let plan of plans" class="plan-card">
      <ion-card-header>
        <ion-card-title>{{ plan.name }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p>{{ plan.description }}</p>
        <ion-button expand="block" (click)="subscribe(plan)" [disabled]="purchasing" class="ion-margin-top">
          {{ purchasing ? 'Processando...' : 'Assinar Agora' }}
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
