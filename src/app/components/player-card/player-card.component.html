<div
  class="player-card"
  [class.player-card--small]="size === 'small'"
  [class.is-active]="isPressed"
  (click)="onCardClick()"
>
  <div class="player-card-inner">

    <ng-container *ngIf="size !== 'small'">
      <div class="player-card-top">
        <div class="player-card-col">
          <ng-container *ngIf="age !== null">
            <div class="player-card-age">{{ age }}</div>
            <div class="player-card-age-label">ANOS</div>
          </ng-container>
          <div class="player-card-position" *ngIf="positionAbbreviation">{{ positionAbbreviation }}</div>
          <div class="player-card-divider"></div>
          <svg class="player-card-flag" viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="20" rx="2" fill="#009c3b"/>
            <polygon points="14,3 25,10 14,17 3,10" fill="#ffdf00"/>
            <circle cx="14" cy="10" r="3.6" fill="#002776"/>
          </svg>
          <div class="player-card-brand">beseen</div>
        </div>

        <div class="player-card-photo" [class.is-editing]="editable" (click)="onPhotoClick()">
          <img *ngIf="photoUrl" [src]="photoUrl" alt="Foto do jogador" (error)="onImageError()" />
          <ion-icon *ngIf="!photoUrl" name="person-circle-outline"></ion-icon>

          <div class="player-card-photo-overlay" *ngIf="editable">
            <ion-spinner *ngIf="uploading" name="crescent"></ion-spinner>
            <ion-icon *ngIf="!uploading" name="camera-outline"></ion-icon>
          </div>
        </div>
      </div>

      <div class="player-card-base">
        <div class="player-card-name">{{ displayName }}</div>
        <div class="player-card-name-line"></div>

        <div class="player-card-stats">
          <div class="player-card-stat">
            <div class="player-card-stat-label">ATA</div>
            <div class="player-card-stat-value">{{ profile?.ata ?? '-' }}</div>
          </div>
          <div class="player-card-stat">
            <div class="player-card-stat-label">DEF</div>
            <div class="player-card-stat-value">{{ profile?.def ?? '-' }}</div>
          </div>
          <div class="player-card-stat">
            <div class="player-card-stat-label">HAB</div>
            <div class="player-card-stat-value">{{ profile?.hab ?? '-' }}</div>
          </div>
          <div class="player-card-stat">
            <div class="player-card-stat-label">FOR</div>
            <div class="player-card-stat-value">{{ profile?.forca ?? '-' }}</div>
          </div>
        </div>

        <div class="player-card-chip" *ngIf="dominantFootLabel">{{ dominantFootLabel }}</div>
      </div>

      <div class="player-card-medal">
        <ion-icon name="football-outline"></ion-icon>
      </div>
    </ng-container>

    <ng-container *ngIf="size === 'small'">
      <div class="player-card-photo player-card-photo--full" [class.is-editing]="editable" (click)="onPhotoClick()">
        <img *ngIf="photoUrl" [src]="photoUrl" alt="Foto do jogador" (error)="onImageError()" />
        <ion-icon *ngIf="!photoUrl" name="person-circle-outline"></ion-icon>

        <div class="player-card-photo-overlay" *ngIf="editable">
          <ion-spinner *ngIf="uploading" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!uploading" name="camera-outline"></ion-icon>
        </div>
      </div>

      <div class="player-card-strip"></div>

      <div class="player-card-ovr" *ngIf="overallRating !== null">{{ overallRating }}</div>
    </ng-container>

  </div>
</div>
