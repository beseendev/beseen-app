<ion-content class="chat-sheet-content">
  <div class="sheet-shell">
    <div class="sheet-header">
      <div class="counterparty-head">
        <div class="avatar-shell">
          <img *ngIf="counterpartAvatarUrl" [src]="counterpartAvatarUrl" [alt]="counterpartName">
          <ion-icon *ngIf="!counterpartAvatarUrl" name="person-circle-outline"></ion-icon>
        </div>

        <div>
          <strong>{{ counterpartName }}</strong>
          <span class="status-badge" [class.liberado]="status === 'ACCEPTED'">{{ statusLabel }}</span>
        </div>
      </div>

      <ion-button fill="clear" class="close-btn" (click)="close()" aria-label="Fechar chat">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="sheet-body" #messagesViewport>
      <div class="empty-chat" *ngIf="!isLoading && messages.length === 0 && status === 'ACCEPTED'">
        Nenhuma mensagem nesta conversa ainda.
      </div>

      <div class="empty-chat" *ngIf="!isLoading && messages.length === 0 && status !== 'ACCEPTED'">
        <ng-container *ngIf="isPlayer; else scoutWaiting">
          O olheiro demonstrou interesse no seu perfil. Aceite para liberar o chat.
        </ng-container>
        <ng-template #scoutWaiting>
          Aguardando o atleta aceitar para habilitar o chat.
        </ng-template>
      </div>

      <div class="loading-messages" *ngIf="isLoading">
        <ion-spinner name="bubbles"></ion-spinner>
      </div>

      <div
        class="chat-bubble"
        *ngFor="let message of messages"
        [class.own]="message.isMine">
        {{ message.text }}
      </div>
    </div>

    <!-- Footer para o Jogador Aceitar -->
    <div class="sheet-footer waiting" *ngIf="status === 'PENDING' && isPlayer">
      <ion-button expand="block" (click)="acceptInvite()" aria-label="Aceitar convite e abrir chat">
        <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
        Aceitar e abrir chat
      </ion-button>
    </div>

    <!-- Footer de Mensagem (Liberado) -->
    <div class="sheet-footer" *ngIf="status === 'ACCEPTED'">
      <ion-item lines="none" class="chat-input">
        <ion-input
          [(ngModel)]="draftMessage"
          [ngModelOptions]="{ standalone: true }"
          placeholder="Digite sua mensagem"
          (keyup.enter)="sendMessage()">
        </ion-input>
        <ion-button
          slot="end"
          fill="clear"
          (click)="sendMessage()"
          aria-label="Enviar mensagem">
          <ion-icon slot="icon-only" name="send-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </div>

    <!-- Footer de Espera (Olheiro) -->
    <div class="sheet-footer waiting" *ngIf="status === 'PENDING' && !isPlayer">
      Aguardando o atleta aceitar para habilitar o chat.
    </div>
  </div>
</ion-content>
