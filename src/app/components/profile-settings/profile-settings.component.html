<ion-button fill="clear" [id]="accountType + '-settings-trigger'" aria-label="Configurações" aria-haspopup="dialog">
  <ion-icon slot="icon-only" name="settings-outline" aria-hidden="true"></ion-icon>
</ion-button>
<ion-popover #settings [trigger]="accountType + '-settings-trigger'" triggerAction="click" [dismissOnSelect]="true">
  <ng-template>
    <ion-list lines="none">
      <h2>Configurações</h2>
      <ion-item button (click)="navigate('/suporte')">
        <ion-icon slot="start" name="help-circle-outline" aria-hidden="true"></ion-icon><ion-label>Suporte</ion-label>
      </ion-item>
      <ion-item button (click)="navigate('/usuarios-bloqueados')">
        <ion-icon slot="start" name="ban-outline" aria-hidden="true"></ion-icon><ion-label>Usuários bloqueados</ion-label>
      </ion-item>
      <ion-item button (click)="logout()">
        <ion-icon slot="start" name="log-out-outline" aria-hidden="true"></ion-icon><ion-label>Sair</ion-label>
      </ion-item>
      <ion-item button class="delete-account-item" (click)="settings.dismiss(); openDeleteAccountOptions()">
        <ion-icon slot="start" name="trash-outline" aria-hidden="true"></ion-icon><ion-label>Excluir conta</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>
