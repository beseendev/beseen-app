<article class="ad-card-tiktok be-fade-in" (click)="goToSite()">
  <!-- Mídia de Fundo -->
  <div class="be-tiktok-media-container">
    <video *ngIf="ad.videoLink" [src]="ad.videoLink" class="be-tiktok-video" autoplay muted loop playsinline></video>
    <img *ngIf="!ad.videoLink && ad.thumbnailLink" [src]="ad.thumbnailLink" class="be-tiktok-video" />
    <div *ngIf="!ad.videoLink && !ad.thumbnailLink" class="ad-media-placeholder">
       <ion-icon name="megaphone-outline"></ion-icon>
    </div>
  </div>

  <!-- Overlay de Informações (Inferior) -->
  <div class="be-tiktok-overlay">
    <div class="be-tiktok-info">
      <div class="ad-badge-container">
        <ion-badge color="primary">Patrocinado</ion-badge>
      </div>
      <h3 class="ad-company-name">@{{ ad.companyName }}</h3>
      <p class="ad-description">{{ ad.description }}</p>
    </div>

    <!-- Botão de Ação -->
    <div class="ad-cta-container">
      <ion-button expand="block" (click)="$event.stopPropagation(); goToSite()" class="cta-button-tiktok">
        {{ ad.ctaText || 'Saiba Mais' }}
        <ion-icon slot="end" name="open-outline"></ion-icon>
      </ion-button>
    </div>
  </div>

  <!-- Ações Laterais (Direita) -->
  <div class="be-tiktok-actions">
    <div class="ad-avatar-circle">
      <ion-icon name="megaphone-outline"></ion-icon>
    </div>
    
    <div class="action-item">
      <ion-icon name="star-outline"></ion-icon>
      <span>Anúncio</span>
    </div>
  </div>
</article>
