<ion-card class="ad-card">
  <ion-item lines="none" class="ad-header">
    <ion-avatar slot="start">
      <div class="ad-avatar-placeholder">
        <ion-icon name="megaphone-outline"></ion-icon>
      </div>
    </ion-avatar>
    <ion-label class="company-name">
      {{ ad.companyName }}
      <p class="sponsored-label">Patrocinado</p>
    </ion-label>
  </ion-item>

  <div class="media-container" (click)="goToSite()">
    <!-- Prioriza o vídeo se existir -->
    <video *ngIf="ad.videoLink" [src]="ad.videoLink" class="ad-media" autoplay muted loop playsinline></video>
    
    <!-- Fallback para imagem se não houver vídeo -->
    <img *ngIf="!ad.videoLink && ad.thumbnailLink" [src]="ad.thumbnailLink" class="ad-media" />
    
    <!-- Placeholder se não houver nada -->
    <div *ngIf="!ad.videoLink && !ad.thumbnailLink" class="ad-media-placeholder">
       <ion-icon name="star-outline"></ion-icon>
    </div>

    <div class="ad-overlay">
       <ion-badge color="primary">Anúncio</ion-badge>
    </div>
  </div>

  <div class="ad-content">
    <div class="ad-info">
      <h3 class="ad-title">{{ ad.description }}</h3>
    </div>

    <ion-button expand="block" (click)="goToSite()" class="cta-button">
      {{ ad.ctaText || 'Saiba Mais' }}
      <ion-icon slot="end" name="open-outline"></ion-icon>
    </ion-button>
  </div>
</ion-card>
