<ion-content class="chat-inbox-content" [scrollEvents]="true">
  <div class="chat-inbox-shell">
    <div class="chat-inbox-header">
      <div>
        <p>Mensagens</p>
        <h2>Conversas com {{ isPlayer ? 'olheiros' : 'atletas' }}</h2>
      </div>

      <ion-button fill="clear" (click)="close()" aria-label="Fechar central de chats">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </div>

    <div class="loading-state" *ngIf="isLoading && threads.length === 0">
      <ion-spinner name="bubbles"></ion-spinner>
    </div>

    <div class="empty-state" *ngIf="!isLoading && threads.length === 0">
      Nenhuma conversa iniciada ainda.
    </div>

    <div class="thread-list" *ngIf="threads.length > 0">
      <button type="button" class="thread-row" *ngFor="let thread of threads; trackBy: trackByThread" (click)="openThread(thread)">
        <app-player-card
          *ngIf="isCounterpartPlayer(thread); else scoutAvatar"
          class="player-profile-avatar"
          [profile]="toPlayerCardProfile(thread)"
          size="xsmall">
        </app-player-card>
        <ng-template #scoutAvatar>
          <div class="avatar-shell">
            <img *ngIf="thread.counterpartAvatar" [src]="thread.counterpartAvatar" [alt]="thread.counterpartName">
            <ion-icon *ngIf="!thread.counterpartAvatar" name="person-circle-outline"></ion-icon>
          </div>
        </ng-template>

        <div class="thread-copy">
          <strong>{{ thread.counterpartName }}</strong>
          <p>
            <ng-container *ngIf="thread.status === 'PENDING'; else lastMsg">
              {{ isPlayer ? 'Novo convite recebido' : 'Aguardando resposta do atleta' }}
            </ng-container>
            <ng-template #lastMsg>
              {{ thread.lastMessage || 'Inicie a conversa...' }}
            </ng-template>
          </p>
        </div>

        <span class="thread-status" [class.open]="thread.status === 'ACCEPTED'">
          {{ thread.status === 'ACCEPTED' ? 'Ativo' : 'Pendente' }}
        </span>
      </button>
    </div>

    <ion-infinite-scroll threshold="100px" (ionInfinite)="loadThreads($event)" *ngIf="hasMore">
      <ion-infinite-scroll-content loadingSpinner="bubbles" loadingText="Carregando mais conversas...">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </div>
</ion-content>
