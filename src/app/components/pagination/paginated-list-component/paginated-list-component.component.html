<!-- paginated-list.component.html -->
<ion-searchbar
  [placeholder]="config.searchPlaceholder || 'Pesquisar...'"
  (ionInput)="onSearch($event)"
  [showClearButton]="always"
  debounce="500"
  class="search-bar"
  *ngIf="config.searchPlaceholder !== null"
></ion-searchbar>

<ion-list *ngIf="items.length > 0" [class]="config.listClass || ''">
  <ion-item
    *ngFor="let item of items; trackBy: config.trackByFn"
    [button]="true"
    (click)="onItemClick(item)"
    [class]="config.itemClass || ''"
  >
    <!-- Conteúdo customizado via projeção -->
    <ng-container *ngTemplateOutlet="itemTemplate; context: { $implicit: item }"></ng-container>
  </ion-item>
</ion-list>

<div *ngIf="error" class="error-state">
  <ion-text color="danger">
    {{ error }}
  </ion-text>
</div>

<div *ngIf="!isLoading && items.length === 0" class="empty-state">
  <ion-icon name="list-outline" class="empty-icon"></ion-icon>
  <p class="empty-message">{{ config.emptyMessage || 'Nenhum item encontrado' }}</p>
</div>

<ion-infinite-scroll
  threshold="100px"
  (ionInfinite)="loadMore($event)"
  *ngIf="hasMore && items.length > 0"
>
  <ion-infinite-scroll-content
    loadingSpinner="bubbles"
    loadingText="Carregando mais..."
  ></ion-infinite-scroll-content>
</ion-infinite-scroll>

<div *ngIf="isLoading && items.length === 0" class="loading-state">
  <ion-spinner name="bubbles" class="loading-spinner"></ion-spinner>
  <p class="loading-text">{{ config.loadingMessage || 'Carregando...' }}</p>
</div>
