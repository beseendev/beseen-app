<ion-content class="login-screen">
  <div class="login-container">
    <div class="brand-wrap">
      <h1 class="brand-title be-heading">
        <span class="brand-be">Be</span>
        <span #brandSeenWrap class="brand-seen-wrap">
          <canvas #stadiumLightsCanvas class="brand-lights-canvas" aria-hidden="true"></canvas>
          <span class="brand-seen">Seen</span>
        </span>
      </h1>
      <p class="brand-tagline be-subheading">Sua vitrine no esporte</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
      <ion-item class="input-field be-field" color="none">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input type="email" formControlName="email" placeholder="Email" autocomplete="off"></ion-input>
      </ion-item>
      <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
        Informe seu e-mail
      </div>

      <ion-item class="input-field be-field" color="none">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Senha" autocomplete="current-password"></ion-input>
        <ion-icon [name]="showPassword ? 'eye-outline' : 'eye-off-outline'" slot="end" class="password-toggle" (click)="togglePasswordVisibility()"></ion-icon>
      </ion-item>
      <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
        Senha obrigatória
      </div>

      <ion-button expand="block" type="submit" [disabled]="loginForm.invalid || isLoading" class="login-button">
        <span *ngIf="!isLoading">LOGIN</span>
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      </ion-button>
    </form>

    <ion-button fill="clear" class="forgot-button" routerLink="/forgot-password">
      ESQUECEU A SENHA?
    </ion-button>

    <div class="divider-text">
      <span class="line"></span>
      <span class="text">Ou faça login com</span>
      <span class="line"></span>
    </div>

    <div class="social-actions">
      <button type="button" class="social-btn social-btn-google" aria-label="Google" [disabled]="isGoogleLoading" (click)="signInWithGoogle()">
        <ion-spinner *ngIf="isGoogleLoading" name="crescent"></ion-spinner>
        <ion-icon *ngIf="!isGoogleLoading" name="logo-google"></ion-icon>
      </button>

      <button type="button" class="social-btn social-btn-apple" aria-label="Apple" *ngIf="isIos" [disabled]="isAppleLoading" (click)="signInWithApple()">
        <ion-spinner *ngIf="isAppleLoading" name="crescent"></ion-spinner>
        <ion-icon *ngIf="!isAppleLoading" name="logo-apple"></ion-icon>
      </button>
    </div>

    <div class="signup-prompt">
      <span class="signup-text">Não tem uma conta?</span>
      <span class="signup-link" routerLink="/signup">Cadastre-se</span>    
    </div>
  </div>
</ion-content>
