<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="loginForm" (ngSubmit)="login()">
    <ion-item>
      <ion-label position="floating">Email</ion-label>
      <ion-input type="email" formControlName="email" required></ion-input>
    </ion-item>
    <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
      Email inválido.
    </div>

    <ion-item>
      <ion-label position="floating">Senha</ion-label>
      <ion-input type="password" formControlName="password" required></ion-input>
    </ion-item>
    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
      Senha obrigatoria.
    </div>

    <ion-button expand="block" type="submit" [disabled]="loginForm.invalid" class="ion-margin-top">
      Entrar
    </ion-button>
  </form>

  <ion-text color="medium" class="ion-text-center ion-margin-top"><p>ou</p></ion-text>

  <ion-button expand="block" fill="outline" color="danger" (click)="signInWithGoogle()" class="ion-margin-top">
    <ion-icon name="logo-google" slot="start"></ion-icon>
    Entrar com Google
  </ion-button>
</ion-content>
