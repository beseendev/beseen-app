<ion-content class="chat-sheet-content">
  <div class="sheet-shell">
    <div class="sheet-header">
      <div class="athlete-head">
        <div class="avatar-shell">
          <img *ngIf="athleteAvatarUrl" [src]="athleteAvatarUrl" [alt]="athleteName">
          <ion-icon *ngIf="!athleteAvatarUrl" name="person-circle-outline"></ion-icon>
        </div>

        <div>
          <strong>{{ athleteName }}</strong>
          <span class="status-badge" [class.liberado]="status === 'LIBERADO'">{{ statusLabel }}</span>
        </div>
      </div>

      <div class="header-actions">
        <ion-button
          *ngIf="status === 'AGUARDANDO_CONFIRMACAO'"
          fill="clear"
          class="accept-btn"
          aria-label="Simular aceite do atleta"
          (click)="simulateAccept()">
          <ion-icon slot="start" name="checkmark-circle-outline"></ion-icon>
          Simular aceite
        </ion-button>

        <ion-button fill="clear" class="close-btn" (click)="close()" aria-label="Fechar chat">
          <ion-icon slot="icon-only" name="close-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

    <div class="sheet-body" #messagesViewport>
      <div class="empty-chat" *ngIf="messages.length === 0 && status !== 'LIBERADO'">
        Aguardando o atleta aceitar para habilitar o chat.
      </div>

      <div class="empty-chat" *ngIf="messages.length === 0 && status === 'LIBERADO'">
        Chat liberado. Envie a primeira mensagem.
      </div>

      <div
        class="chat-bubble"
        *ngFor="let message of messages"
        [class.own]="message.sender === 'SCOUT'">
        {{ message.text }}
      </div>
    </div>

    <div class="sheet-footer" *ngIf="status === 'LIBERADO'">
      <ion-item lines="none" class="chat-input">
        <ion-input
          [(ngModel)]="draftMessage"
          [ngModelOptions]="{ standalone: true }"
          placeholder="Digite sua mensagem">
        </ion-input>
        <ion-button
          slot="end"
          fill="clear"
          (click)="sendMessage()"
          aria-label="Enviar mensagem">
          <ion-icon slot="icon-only" name="send-outline"></ion-icon>
        </ion-button>
      </ion-item>
    </div>

    <div class="sheet-footer waiting" *ngIf="status !== 'LIBERADO'">
      Aguardando o atleta aceitar para habilitar o chat.
    </div>
  </div>
</ion-content>
