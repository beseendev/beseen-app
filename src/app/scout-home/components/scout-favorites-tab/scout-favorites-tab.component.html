<section class="content-section section">
  <div class="section-heading">
    <p class="eyebrow">Favoritos</p>
    <h2>Videos dos atletas favoritos</h2>
  </div>

  <div class="empty-state" *ngIf="items.length === 0">
    Favorite atletas na vitrine para ver aqui somente os videos deles.
  </div>

  <div class="video-list be-tiktok-container" *ngIf="items.length > 0">
    <ng-container *ngFor="let item of items; trackBy: trackByCard">
      <article class="be-tiktok-card be-fade-in" *ngIf="item.type === 'video'">
        <video #vFav [src]="item.video.mediaUrl" autoplay muted loop playsinline controlsList="nodownload nopictureinpicture" preload="metadata" class="be-tiktok-video"></video>
        
        <div class="be-tiktok-overlay">
          <div class="be-tiktok-info">
            <button type="button" class="profile-link" (click)="openAthleteProfile(item.video)">
              <h3>@{{ item.video.athleteName }}</h3>
            </button>
            <p class="showcase-description" *ngIf="item.video.destaque">{{ item.video.destaque }}</p>
            <p class="meta-line" *ngIf="item.video.modalidade || item.video.localidade">
                <span *ngIf="item.video.modalidade">{{ item.video.modalidade }}</span>
                <span *ngIf="item.video.modalidade && item.video.localidade"> • </span>
                <span *ngIf="item.video.localidade">{{ item.video.localidade }}</span>
            </p>
          </div>

          <div class="chat-state-panel" *ngIf="subscriptionService.canSendInvites()">
            <ng-container [ngSwitch]="item.video.inviteStatus">
              <div *ngSwitchCase="null" class="state-block">
                <ion-button size="small" fill="solid" color="primary" (click)="invite(item.video)">
                  Convidar para conversar
                </ion-button>
              </div>

              <div *ngSwitchCase="'PENDING'" class="state-block">
                <span class="status-tag" style="background: var(--be-color-warning); color: #000; border: none;">Aguardando confirmação</span>
              </div>

              <div *ngSwitchCase="'ACCEPTED'" class="state-block">
                <ion-button size="small" fill="solid" color="success" (click)="openChat(item.video)">
                  Abrir chat
                </ion-button>
              </div>

              <div *ngSwitchCase="'REJECTED'" class="state-block">
                <span class="status-tag" style="background: var(--be-color-danger); color: #fff; border: none;">Convite rejeitado</span>
              </div>

              <div *ngSwitchDefault class="state-block">
                 <ion-button *ngIf="!item.video.inviteStatus" size="small" fill="solid" color="primary" (click)="invite(item.video)">
                  Convidar para conversar
                </ion-button>
              </div>
            </ng-container>
          </div>
        </div>

        <div class="be-tiktok-actions">
           <div class="be-tiktok-avatar" (click)="openAthleteProfile(item.video)">
              <img *ngIf="item.video.athleteAvatarUrl" [src]="item.video.athleteAvatarUrl" [alt]="item.video.athleteName">
              <ion-icon *ngIf="!item.video.athleteAvatarUrl" name="person-circle-outline" style="font-size: 40px; color: white;"></ion-icon>
           </div>
           
           <ion-button
            fill="clear"
            class="favorite-btn"
            (click)="toggleFavorite(item.video)"
            style="--color: #fff; margin-bottom: 8px;">
            <ion-icon name="heart" style="font-size: 32px; color: var(--be-color-brand-500)"></ion-icon>
          </ion-button>
        </div>
      </article>
      <app-ad-card *ngIf="item.type === 'ad'" [ad]="item.ad"></app-ad-card>
    </ng-container>
  </div>
</section>
